apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: gateway
  ports:
    - name: http-rest
      port: 80
      targetPort: 8000
    - name: http-mcp
      port: 8001
      targetPort: 8001