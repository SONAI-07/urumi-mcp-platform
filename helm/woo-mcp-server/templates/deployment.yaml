apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      {{- if .Values.wooHostAliasIP }}
      hostAliases:
        - ip: {{ .Values.wooHostAliasIP }}
          hostnames:
            - store.127.0.0.1.nip.io
      {{- end }}
      containers:
        - name: mcp-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: WOO_URL
              value: {{ .Values.wooUrl }}
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woo-api-credentials
                  key: consumer_key
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woo-api-credentials
                  key: consumer_secret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20